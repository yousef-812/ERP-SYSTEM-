name: snapshot
on: workflow_dispatch
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy clean snapshot
        run: |
          git clone --depth 1 https://github.com/yousef-812/ERP-SYSTEM-.git /tmp/src
          rm -rf /tmp/src/.git
          cp -a /tmp/src/. .
          sed -i 's/Development_Only[A-Za-z0-9_]*/REPLACE_WITH_YOUR_OWN_LONG_RANDOM_SECRET/' Server/appsettings.json
          git config user.name "Yousef Yousry"
          git config user.email "yousef-812@users.noreply.github.com"
          git add -A -- . ':!.github'
          git commit -m "Add ERP system source"
          git push
